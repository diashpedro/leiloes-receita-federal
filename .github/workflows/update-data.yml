name: Atualizar dados dos leiloes

on:
  workflow_dispatch: {}
  schedule:
    # 03:00 UTC = 00:00 em Brasilia (sem horario de verao). Ajuste se precisar de outra janela.
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas requests openpyxl urllib3 pypdf

      # So editais ainda abertos (2 disponibilizado, 3 aberto p/ proposta, 4 fechado p/ proposta,
      # 5-7 sessao publica/lances, 13 suspenso). Os encerrados vao para historico/ no passo seguinte.
      - name: Rodar scraper (editais abertos)
        run: python leilao_receita_scraper.py --situacoes 2 3 4 5 6 7 13 --output leiloes_receita.xlsx --workers 10 --delay 1.0

      - name: Coletar valores de arrematacao dos editais encerrados (so os que ainda faltam em historico/)
        run: python historico_arrematacao.py --pasta historico

      - name: Exportar dados para o dashboard
        run: python export_dashboard_data.py leiloes_receita.xlsx docs/data historico

      - name: Commit e push se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leiloes_receita.xlsx docs/data historico
          if git diff --cached --quiet; then
            echo "Sem mudancas nos dados."
          else
            git commit -m "Atualizacao automatica dos dados do leilao ($(date -u +%Y-%m-%d))"
            git push
          fi
