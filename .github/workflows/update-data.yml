name: Atualizar dados dos leiloes

on:
  workflow_dispatch: {}
  schedule:
    # 03:00 UTC = 00:00 em Brasilia (sem horario de verao). Ajuste se precisar de outra janela.
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas requests openpyxl urllib3

      - name: Rodar scraper (raspa todos os editais/lotes/itens disponiveis)
        run: python leilao_receita_scraper.py --output leiloes_receita.xlsx --workers 10 --delay 1.0

      - name: Exportar dados para o dashboard
        run: python export_dashboard_data.py leiloes_receita.xlsx docs/data

      - name: Commit e push se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leiloes_receita.xlsx docs/data
          if git diff --cached --quiet; then
            echo "Sem mudancas nos dados."
          else
            git commit -m "Atualizacao automatica dos dados do leilao ($(date -u +%Y-%m-%d))"
            git push
          fi
